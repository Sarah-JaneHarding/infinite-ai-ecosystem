# Development data plane — Stage 01 step 1.
#
# Postgres 16 with pgvector, pg_trgm and pgcrypto; Redis 7 for queues, rate limits and
# idempotency keys; Keycloak (Stage 02); MinIO (object storage — see below). Langfuse and
# the Grafana stack are still not here: a production-readiness audit found this file's
# own comment claiming they were "added by the stages that need them" had gone stale —
# neither ever landed, and Langfuse's self-hosted footprint (its own Postgres, ClickHouse,
# Redis and S3 bucket) is a separate, larger piece of work than this file's other
# additions. Tracked as a follow-up, not silently left implied-done by this comment.
#
# Rule 7: no secret in this file. Values come from a local .env that is never committed.
# The placeholders below resolve from the developer's environment and have no defaults,
# so an unconfigured machine fails loudly instead of booting with a known password.
#
# See infra/docker/.env.example for every variable this file needs (a disjoint set from
# the root .env.example, which covers the application's own runtime config, not the
# database superuser or per-role passwords) and docs/DEV_SETUP.md for the full sequence:
# `docker compose --env-file infra/docker/.env -f infra/docker/compose.dev.yml up -d`.

name: infinite-ai-dev

services:
  postgres:
    # pgvector's image rather than the stock postgres one: §1.1 locks pgvector with HNSW
    # indexes for the Brain's L1 tier, and `CREATE EXTENSION vector` fails on stock
    # postgres:16-alpine. Same Postgres 16, extension pre-built.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in your local .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in your local .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your local .env}
      # Consumed by initdb/02-roles.sh. No defaults: an unset value must fail the
      # bootstrap, not silently create a role with a password someone can guess.
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?set MIGRATOR_PASSWORD in your local .env}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD:?set APP_RW_PASSWORD in your local .env}
      WORKER_RW_PASSWORD: ${WORKER_RW_PASSWORD:?set WORKER_RW_PASSWORD in your local .env}
      ANALYTICS_RO_PASSWORD: ${ANALYTICS_RO_PASSWORD:?set ANALYTICS_RO_PASSWORD in your local .env}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Extensions and the four database roles (app_rw, worker_rw, migrator,
      # analytics_ro) are created here in Stage 01.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  # Keycloak — Stage 02 identity provider. Imports the realm.json on first boot.
  # Rule 7: KEYCLOAK_ADMIN_PASSWORD comes from the developer's local .env, never a default.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in your local .env}
      KC_DB_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER in your local .env}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your local .env}
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN in your local .env}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in your local .env}
      # Substituted into infra/keycloak/realm.json's infinite-ai-web/infinite-ai-worker
      # client secrets at import time via Keycloak's own ${VAR} environment-variable
      # placeholder resolution. Without these, the container never sees the values the
      # realm file references — apps/web's AUTH_KEYCLOAK_SECRET must match the web one.
      KEYCLOAK_WEB_CLIENT_SECRET: ${KEYCLOAK_WEB_CLIENT_SECRET:?set KEYCLOAK_WEB_CLIENT_SECRET in your local .env}
      KEYCLOAK_WORKER_CLIENT_SECRET: ${KEYCLOAK_WORKER_CLIENT_SECRET:?set KEYCLOAK_WORKER_CLIENT_SECRET in your local .env}
    ports:
      - '8180:8080'
    volumes:
      - ../../infra/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8080/health/ready || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30

  # MinIO — S3-compatible object storage for local dev. `OBJECT_STORE_ENDPOINT` and
  # `OBJECT_STORE_BUCKET` (root .env.example) point here; production points the same two
  # variables at a real S3 bucket in af-south-1 instead — nothing in application code
  # changes between the two, since both speak the S3 API.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in your local .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in your local .env}
    ports:
      - '9000:9000' # S3 API — this is what OBJECT_STORE_ENDPOINT points at.
      - '9001:9001' # Web console, for looking inside the bucket by hand.
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the bucket application code expects and exits. `mc` has no
  # "create if missing, otherwise no-op" flag, hence `mb --ignore-existing`, so a second
  # `docker compose up` on an already-provisioned volume is a clean no-op, not an error.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in your local .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in your local .env}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:?set OBJECT_STORE_BUCKET in your local .env}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$OBJECT_STORE_BUCKET"

volumes:
  postgres-data:
  redis-data:
  minio-data:
