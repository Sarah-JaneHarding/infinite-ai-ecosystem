# Development data plane — Stage 01 step 1.
#
# Postgres 16 with pgvector, pg_trgm and pgcrypto; Redis 7 for queues, rate limits and
# idempotency keys; Keycloak (Stage 02); MinIO (object storage); Langfuse (self-hosted
# LLM observability — see below). The Grafana stack (Tempo/Loki/Mimir) is still not
# here: `packages/telemetry/src/tracing.ts`'s own header explains why the code in this
# repo only ever targets one OTLP endpoint — Langfuse ingests OTLP directly at
# `/api/public/otel`, so standing up Langfuse is what actually makes
# `OTEL_EXPORTER_OTLP_ENDPOINT` point at something real; a separate Tempo/Loki/Mimir
# stack was never wired into any application code to send spans to in the first place.
#
# Langfuse gets its own Postgres, Redis and ClickHouse — never sharing the app's own
# `postgres`/`redis` above — so its migrations and internal queues can never collide
# with ours. Only MinIO is shared: a second bucket (`langfuse`, created by `minio-init`
# below) costs nothing extra to run, and S3 buckets are namespaced, so there is no
# collision risk the way there would be sharing a database or a queue.
#
# Rule 7: no secret in this file. Values come from a local .env that is never committed.
# The placeholders below resolve from the developer's environment and have no defaults,
# so an unconfigured machine fails loudly instead of booting with a known password.
#
# See infra/docker/.env.example for every variable this file needs (a disjoint set from
# the root .env.example, which covers the application's own runtime config, not the
# database superuser or per-role passwords) and docs/DEV_SETUP.md for the full sequence:
# `docker compose --env-file infra/docker/.env -f infra/docker/compose.dev.yml up -d`.

name: infinite-ai-dev

services:
  postgres:
    # pgvector's image rather than the stock postgres one: §1.1 locks pgvector with HNSW
    # indexes for the Brain's L1 tier, and `CREATE EXTENSION vector` fails on stock
    # postgres:16-alpine. Same Postgres 16, extension pre-built.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in your local .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in your local .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your local .env}
      # Consumed by initdb/02-roles.sh. No defaults: an unset value must fail the
      # bootstrap, not silently create a role with a password someone can guess.
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?set MIGRATOR_PASSWORD in your local .env}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD:?set APP_RW_PASSWORD in your local .env}
      WORKER_RW_PASSWORD: ${WORKER_RW_PASSWORD:?set WORKER_RW_PASSWORD in your local .env}
      ANALYTICS_RO_PASSWORD: ${ANALYTICS_RO_PASSWORD:?set ANALYTICS_RO_PASSWORD in your local .env}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Extensions and the four database roles (app_rw, worker_rw, migrator,
      # analytics_ro) are created here in Stage 01.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  # Keycloak — Stage 02 identity provider. Imports the realm.json on first boot.
  # Rule 7: KEYCLOAK_ADMIN_PASSWORD comes from the developer's local .env, never a default.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in your local .env}
      KC_DB_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER in your local .env}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your local .env}
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN in your local .env}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in your local .env}
      # Substituted into infra/keycloak/realm.json's infinite-ai-web/infinite-ai-worker
      # client secrets at import time via Keycloak's own ${VAR} environment-variable
      # placeholder resolution. Without these, the container never sees the values the
      # realm file references — apps/web's AUTH_KEYCLOAK_SECRET must match the web one.
      KEYCLOAK_WEB_CLIENT_SECRET: ${KEYCLOAK_WEB_CLIENT_SECRET:?set KEYCLOAK_WEB_CLIENT_SECRET in your local .env}
      KEYCLOAK_WORKER_CLIENT_SECRET: ${KEYCLOAK_WORKER_CLIENT_SECRET:?set KEYCLOAK_WORKER_CLIENT_SECRET in your local .env}
    ports:
      - '8180:8080'
    volumes:
      - ../../infra/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8080/health/ready || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30

  # MinIO — S3-compatible object storage for local dev. `OBJECT_STORE_ENDPOINT` and
  # `OBJECT_STORE_BUCKET` (root .env.example) point here; production points the same two
  # variables at a real S3 bucket in af-south-1 instead — nothing in application code
  # changes between the two, since both speak the S3 API.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in your local .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in your local .env}
    ports:
      - '9000:9000' # S3 API — this is what OBJECT_STORE_ENDPOINT points at.
      - '9001:9001' # Web console, for looking inside the bucket by hand.
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the bucket application code expects and exits. `mc` has no
  # "create if missing, otherwise no-op" flag, hence `mb --ignore-existing`, so a second
  # `docker compose up` on an already-provisioned volume is a clean no-op, not an error.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in your local .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in your local .env}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:?set OBJECT_STORE_BUCKET in your local .env}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$OBJECT_STORE_BUCKET" &&
        mc mb --ignore-existing "local/langfuse"

  # --- Langfuse (self-hosted) — LLM observability backend, per this file's own header
  # comment. Shape verified against Langfuse's own reference compose file
  # (github.com/langfuse/langfuse, `docker-compose.yml`, fetched 2026-08-31); every
  # credential below is required with no default, unlike that reference's own `:-`
  # fallbacks — rule 7 and this file's own existing convention (Postgres/Keycloak/MinIO
  # above) both already refuse to ship a guessable default password.
  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    user: '101:101'
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:?set LANGFUSE_CLICKHOUSE_USER in your local .env}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?set LANGFUSE_CLICKHOUSE_PASSWORD in your local .env}
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:8123/ping',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: ${LANGFUSE_POSTGRES_USER:?set LANGFUSE_POSTGRES_USER in your local .env}
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?set LANGFUSE_POSTGRES_PASSWORD in your local .env}
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${LANGFUSE_REDIS_PASSWORD:?set LANGFUSE_REDIS_PASSWORD in your local .env}
      - --maxmemory-policy
      - noeviction
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      # Compose substitutes ${VAR} in this string at parse time, from the same
      # infra/docker/.env file — no need to also inject it as a container-runtime var,
      # unlike `$$POSTGRES_USER`-style references elsewhere in this file, which
      # deliberately defer to the container's own runtime environment instead.
      test:
        [
          'CMD-SHELL',
          'redis-cli -a "${LANGFUSE_REDIS_PASSWORD:?set LANGFUSE_REDIS_PASSWORD in your local .env}" ping',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  # Registers every field application code needs, then langfuse-web's own block below
  # adds the handful (NEXTAUTH_SECRET, the LANGFUSE_INIT_* bootstrap) only it needs.
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.25.0
    restart: unless-stopped
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:3001
      DATABASE_URL: postgresql://${LANGFUSE_POSTGRES_USER:?set LANGFUSE_POSTGRES_USER in your local .env}:${LANGFUSE_POSTGRES_PASSWORD:?set LANGFUSE_POSTGRES_PASSWORD in your local .env}@langfuse-postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT in your local .env}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY in your local .env}
      TELEMETRY_ENABLED: 'false'
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:?set LANGFUSE_CLICKHOUSE_USER in your local .env}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?set LANGFUSE_CLICKHOUSE_PASSWORD in your local .env}
      REDIS_HOST: langfuse-redis
      REDIS_PORT: '6379'
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:?set LANGFUSE_REDIS_PASSWORD in your local .env}
      # The langfuse bucket minio-init (above) creates on the app's own shared MinIO —
      # see this file's header for why sharing MinIO (not Postgres/Redis) is safe.
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in your local .env}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in your local .env}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in your local .env}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in your local .env}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
    ports:
      - '127.0.0.1:3030:3030'

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.25.0
    restart: unless-stopped
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET in your local .env}
      # Bootstraps a real org/project/user/API-key pair on first boot — the public/secret
      # key pair here is what the root .env's OTEL_EXPORTER_OTLP_HEADERS is built from
      # (docs/DEV_SETUP.md), the same "same value, two files" shape
      # KEYCLOAK_WEB_CLIENT_SECRET already has. No manual "sign up in the UI" step.
      LANGFUSE_INIT_ORG_ID: dev-org
      LANGFUSE_INIT_ORG_NAME: INFINITE-AI Dev
      LANGFUSE_INIT_PROJECT_ID: dev-project
      LANGFUSE_INIT_PROJECT_NAME: infinite-ai-dev
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?set LANGFUSE_INIT_PROJECT_PUBLIC_KEY in your local .env}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?set LANGFUSE_INIT_PROJECT_SECRET_KEY in your local .env}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?set LANGFUSE_INIT_USER_EMAIL in your local .env}
      LANGFUSE_INIT_USER_NAME: Dev Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?set LANGFUSE_INIT_USER_PASSWORD in your local .env}
    ports:
      # 3000 is already apps/web's own dev port (docs/DEV_SETUP.md step 6) — published on
      # 3001 instead so both can run at once, which is the whole point of having traces
      # to look at while exercising the app.
      - '3001:3000'

volumes:
  postgres-data:
  redis-data:
  minio-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-postgres-data:
  langfuse-redis-data:
