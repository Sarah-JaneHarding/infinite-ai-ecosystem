name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per ref. A newer push cancels an in-flight run for the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: install → lint → typecheck → unit → build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # §4.2's thresholds are declared per package in vitest.config.ts and only bite when
      # coverage actually runs. Running it on every PR rather than only in the stage gate
      # means a drop below the floor fails the change that caused it, rather than the
      # stage gate three weeks later with nobody sure which commit did it.
      - name: Coverage thresholds (§4.2)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Stage gate
        run: pnpm verify:stage 00

  forbidden-patterns:
    name: forbidden patterns (Part 6 §6.1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Rule 2: a skipped or focused test is never committed. ESLint covers the common
      # forms; this is the belt-and-braces check that also catches them in untyped files.
      - name: No skipped or focused tests
        run: |
          if grep -rnE '\b(describe|it|test)\.(only|skip|todo)\b|\bx(it|describe|test)\(' \
               --include='*.ts' --include='*.tsx' --include='*.js' \
               apps packages 2>/dev/null; then
            echo "::error::Rule 2 — skipped or focused tests are forbidden in committed code."
            exit 1
          fi

      # Rule 7: .env.example carries key names with empty values only.
      - name: .env.example holds no values
        run: |
          if grep -vE '^\s*(#.*)?$' .env.example | grep -vE '^[A-Z0-9_]+=$'; then
            echo "::error::Rule 7 — .env.example must contain key names with empty values only."
            exit 1
          fi

  database:
    name: RLS isolation suite (real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # This job is the one that turns tenant isolation from a claim into a finding.
    # Testcontainers starts its own pgvector/pgvector:pg16 container using the real
    # infra/docker/initdb scripts, so no `services:` block is needed here.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Runs both tiers with coverage and applies §4.2's 95% threshold to the union of
      # them. Roughly two-thirds of packages/db cannot execute without a database, so this
      # is the only place a coverage figure for the package means anything — measuring it
      # without the isolation suite would be measuring the wrong thing.
      - name: RLS isolation suite and merged coverage (§4.2)
        run: pnpm --filter @infinite-ai/db coverage:merged
