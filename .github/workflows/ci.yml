name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per ref. A newer push cancels an in-flight run for the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: install → lint → typecheck → unit → build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Stage 07 step 5: "on any change to a prompt, agent, guardrail or retrieval code,
      # run the affected eval sets; fail the build on regression beyond the declared
      # tolerance." Runs every golden set that has both cases on disk and a registered
      # executor — nothing exists yet (Stage 08 is the first real agent), so this is
      # currently a no-op that exits 0, wired for real rather than a stub: the day a golden
      # set and an executor both exist, this step starts actually gating the build.
      - name: Eval regression gate (Stage 07 step 5)
        run: pnpm evals:gate

      # §4.2's thresholds are declared per package in vitest.config.ts and only bite when
      # coverage actually runs. Running it on every PR rather than only in the stage gate
      # means a drop below the floor fails the change that caused it, rather than the
      # stage gate three weeks later with nobody sure which commit did it.
      - name: Coverage thresholds (§4.2)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Stage gate
        run: pnpm verify:stage 00

  forbidden-patterns:
    name: forbidden patterns (Part 6 §6.1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Rule 2: a skipped or focused test is never committed. ESLint covers the common
      # forms; this is the belt-and-braces check that also catches them in untyped files.
      - name: No skipped or focused tests
        run: |
          if grep -rnE '\b(describe|it|test)\.(only|skip|todo)\b|\bx(it|describe|test)\(' \
               --include='*.ts' --include='*.tsx' --include='*.js' \
               apps packages 2>/dev/null; then
            echo "::error::Rule 2 — skipped or focused tests are forbidden in committed code."
            exit 1
          fi

      # Rule 7: every .env.example in the repo carries key names with empty values only.
      # apps/gateway and apps/web additionally assert this in their own unit tests
      # (parity against GatewayEnvSchema/WebEnvSchema); this check is the belt-and-braces
      # net that also catches infra/docker/.env.example, which nothing else validates.
      - name: .env.example files hold no values
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if grep -vE '^\s*(#.*)?$' "$file" | grep -vE '^[A-Z0-9_]+=$'; then
              echo "::error::Rule 7 — $file must contain key names with empty values only."
              status=1
            fi
          done < <(find . -name '.env.example' -not -path '*/node_modules/*' -print0)
          exit $status

  database:
    name: RLS isolation suite (real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # This job is the one that turns tenant isolation from a claim into a finding.
    # Testcontainers starts its own pgvector/pgvector:pg16 container using the real
    # infra/docker/initdb scripts, so no `services:` block is needed here.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Runs both tiers with coverage and applies §4.2's 95% threshold to the union of
      # them. Roughly two-thirds of packages/db cannot execute without a database, so this
      # is the only place a coverage figure for the package means anything — measuring it
      # without the isolation suite would be measuring the wrong thing.
      - name: RLS isolation suite and merged coverage (§4.2)
        run: pnpm --filter @infinite-ai/db coverage:merged

      # Stage 05 step 2's write path: resumability, versioning and the ratification gate,
      # proven against the same real Postgres rather than asserted from a mock transaction.
      - name: Brain write-path integration suite (real Postgres)
        run: pnpm --filter @infinite-ai/brain test:integration

      # Stage 06 step 4's runner: durability, resumability, retries, timeouts,
      # compensation, human gates and map fan-out, proven against the same real Postgres —
      # not previously wired into CI (Stage 52), so this whole file's 39 tests had never
      # actually been run by anyone since being written.
      - name: Orchestrator runner integration suite (real Postgres)
        run: pnpm --filter @infinite-ai/orchestrator test:integration

      # Stage 29's CAPS/ATP write path: the same gap as the orchestrator suite above —
      # written blind against the same Testcontainers pattern, never previously wired in.
      - name: Curriculum-seed write-path integration suite (real Postgres)
        run: pnpm --filter @infinite-ai/curriculum-seed test:integration
