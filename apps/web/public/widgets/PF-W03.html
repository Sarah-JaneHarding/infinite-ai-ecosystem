.mark{width:44px;height:22px;flex:none}
.ttl{font:600 1.05rem var(--head);margin:0}
.sp{flex:1}
.chip{display:inline-block;font:600 .66rem var(--body);letter-spacing:.12em;text-transform:uppercase;padding:.2rem .55rem;border-radius:99px;border:1px solid var(--line);color:var(--muted);max-width:100%}
.chip.v{color:#b7a6ff;border-color:rgba(124,92,255,.5)}.chip.c{color:var(--cyan);border-color:rgba(45,212,191,.5)}.chip.g{color:var(--gold);border-color:rgba(245,184,65,.5)}.chip.r{color:var(--rose);border-color:rgba(251,113,133,.5)}

section.zone{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0}
section.zone>h2{font:600 .7rem var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:0 0 .8rem}
h3{font:600 1rem var(--head);margin:1rem 0 .4rem}
button,.btn{font:600 .85rem var(--body);color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:.5rem .85rem;cursor:pointer;min-height:38px}
button:hover{border-color:var(--violet)}
button.pri{background:var(--arc);color:#05070F;border:0}
button.ok{border-color:rgba(45,212,191,.6);color:var(--cyan)}button.no{border-color:rgba(251,113,133,.6);color:var(--rose)}button.ed{border-color:rgba(245,184,65,.6);color:var(--gold)}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--text);background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:.5rem .65rem;max-width:100%}
textarea{width:100%;min-height:120px;font:.8rem/1.45 ui-monospace,Menlo,Consolas,monospace}
label{font-size:.82rem;color:var(--muted);display:block;margin:.5rem 0 .2rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.cap{font-size:.8rem;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{text-align:left;padding:.5rem .65rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 .62rem var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
code,pre{font:.78rem ui-monospace,Menlo,Consolas,monospace}
pre{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto;max-height:340px;margin:.4rem 0;white-space:pre-wrap;word-break:break-word}
.pass{color:var(--cyan)}.fail{color:var(--rose)}.warn{color:var(--gold)}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:12px;text-align:center;font-size:.85rem;color:var(--muted);transition:.15s}
.drop.over{border-color:var(--violet);background:rgba(124,92,255,.08)}
.drop b{display:block;margin-bottom:2px}
.dec{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:1px solid rgba(245,184,65,.4);border-radius:12px;background:rgba(245,184,65,.06)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
details{margin:.4rem 0}summary{cursor:pointer;color:var(--muted);font-size:.85rem}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--violet);padding:.5rem .9rem;border-radius:10px;z-index:50;font-size:.85rem}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;font-size:.84rem}.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
@media print{header.top button,.dec,.drop{display:none}body{background:#fff;color:#000}}

.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:var(--panel2)}.item.done{opacity:.7}.item h4{margin:0 0 4px;font:600 .95rem var(--head)}
.why{font-size:.8rem;margin:.2rem 0}.why.bad{color:var(--rose)}.why.ok{color:var(--cyan)}

      var a = card.querySelector('.doApprove'), r = card.querySelector('.doReject'), ed = card.querySelector('.doEdit');
      if (a) a.onclick = function () { var x = inbox.decide(run, 'approve', $('#viewer').value, card.querySelector('.why-in').value); if (!x.ok) say(x.errors.join(' '), 'fail'); render(); renderLedger(); };
      if (r) r.onclick = function () { var x = inbox.decide(run, 'reject', $('#viewer').value, card.querySelector('.why-in').value); if (!x.ok) say(x.errors.join(' '), 'fail'); render(); renderLedger(); };
      if (ed) ed.onclick = function () { var p; try { p = JSON.parse(card.querySelector('.edtxt').value); } catch (e) { say('Not valid JSON: ' + e.message, 'fail'); return; } var x = inbox.edit(run, p, $('#viewer').value, card.querySelector('.why-in').value); if (!x.ok) say(x.errors.join(' '), 'fail'); render(); renderLedger(); };
    });
  }
  function renderLedger() {
    var L = inbox.ledger; $('#ledger').innerHTML = L.length ? '<div class="tw"><table><thead><tr><th>Time</th><th>Decision</th><th>Role</th><th>Widget · event</th><th>Run</th><th>Reason</th></tr></thead><tbody>' + L.slice().reverse().map(function (d) { return '<tr><td>' + esc(new Date(d.time).toLocaleTimeString()) + '</td><td class="' + (d.decision === 'approved' ? 'pass' : d.decision === 'rejected' ? 'fail' : 'warn') + '"><strong>' + esc(d.decision) + '</strong></td><td>' + esc(d.role || '') + '</td><td>' + esc(d.widgetId) + ' · <code>' + esc(d.event) + '</code></td><td class="cap">' + esc(d.runId) + '</td><td>' + esc(d.reason || '') + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<p class="cap">No decisions yet. The ledger only ever grows: a decision is never changed, only followed by another.</p>';
    $('#sent').innerHTML = sentLog.length ? sentLog.slice(-6).map(function (s) { return '<div>' + esc(new Date(s.t).toLocaleTimeString()) + ' · <code>' + esc(s.event) + '</code> · ' + esc(s.what) + '</div>'; }).join('') : 'Nothing released yet.';
  }
  var sentLog = [];
  function emit(env) { ctx.sendOut(env); sentLog.push({ t: IAI.nowIso(), event: env.event, what: env.event === 'gate.decided' ? 'decision record' : 'RELEASED to the next widget (' + env.widgetId + ')' }); }

  var cfg = {
    title: 'Nothing moves on <span class="arc">until the right person decides.</span>',
    lead: 'Draft outputs from widgets wait here. The role named on each item can approve, edit or reject it. Only an approved item is released to the next widget, once, and every decision goes into a ledger that is never rewritten.',
    noSourceRefs: true,
    selfTests: function () {
      var rows = [IAI.manifestChecks(man), IAI.a11yChecks()], pend = inbox.pending().length;
      rows.push({ name: 'Nothing released without approval', ok: Object.keys(inbox.released).length === inbox.items.filter(function (x) { return x.state === 'approved'; }).length ? 'pass' : 'fail', detail: Object.keys(inbox.released).length + ' released; ' + pend + ' still waiting.' });
      rows.push({ name: 'Ledger is append-only', ok: 'pass', detail: inbox.ledger.length + ' entr' + (inbox.ledger.length === 1 ? 'y' : 'ies') + '; the page has no way to edit or delete one.' });
      rows.push({ name: 'Every file labelled and read or flagged', ok: ui.ing && ui.ing.files.some(function (f) { return !f.label; }) ? 'fail' : 'pass', detail: (ui.ing ? ui.ing.files.length : 0) + ' file(s).' });
      return rows;
    },
    handoffTests: function () {
      var out = [], sent = [], ib = makeInbox(function (e) { sent.push(e); }), s = sampleItems(), role = 'Teacher', rel = function () { return sent.filter(function (e) { return e.event !== 'gate.decided'; }); };
      function R(n, ok, d) { out.push({ name: n, ok: ok ? 'pass' : 'fail', detail: d }); }
      var a1 = ib.add(s[0]), badAppr = ib.add(Object.assign(IAI.clone(s[0]), { runId: 'x', gate: { status: 'approved', role: 'Teacher', time: 't' } })), junk = ib.add('nope');
      R('1 Accept', a1.ok && !(a1.problems || []).length && !badAppr.ok && !junk.ok, 'A complete draft was taken in as pending. An already-approved output and a non-envelope were refused.');
      var x = ib.decide(s[0].runId, 'reject', role, 'test'); R('2 Gate', !rel().length && x.ok, 'While pending nothing was released, and a rejection released nothing (' + rel().length + ' released).');
      var inc = ib.add(s[2]), bad = ib.decide(s[2].runId, 'approve', 'HoD', ''), brk = ib.add({ widgetId: 'Z', event: 'z.y.x', gate: { status: 'draft', role: 'Teacher' } });
      R('3 Break', inc.ok && !bad.ok && brk.ok && ib.decide(brk.runId || ib.items[ib.items.length - 1].env.runId, 'approve', 'Teacher', '').ok === false, 'An envelope with no sourceRefs, or missing its payload, was taken in but could not be approved; no crash.');
      var f = ib.add(Object.assign(IAI.clone(s[0]), { runId: 'once-1' })), d1 = ib.decide('once-1', 'approve', role, 'ok'), d2 = ib.decide('once-1', 'approve', role, 'again'); R('4 Fire once', d1.released && d2.duplicate && rel().length === 1, 'Approved twice; released ' + rel().length + ' time(s).');
      var wr = ib.add(Object.assign(IAI.clone(s[0]), { runId: 'role-1', event: 'ce.other.approved' })), wrong = ib.decide('role-1', 'approve', 'Principal', ''); 
      var n1 = ib.add(Object.assign(IAI.clone(s[0]), { runId: 'chg-1' })), n2 = ib.add(Object.assign(IAI.clone(s[0]), { runId: 'chg-2' })); var old = ib.items.filter(function (z) { return z.env.runId === 'chg-1'; })[0], blockedOld = ib.decide('chg-1', 'approve', role, '');
      R('5 Change', old.superseded && !blockedOld.ok && !wrong.ok, 'A newer output from the same widget made the older pending one stale and unapprovable. The wrong role could not decide.');
      var pi = ib.add(Object.assign(IAI.clone(s[1]), { runId: 'pii-1' })), pd = ib.decide('pii-1', 'approve', 'SBST chair', ''); R('6 Personal information', pi.ok && !pd.ok && /Personal information/.test(pd.errors[0]), 'A fake name, phone and ID in the payload blocked approval until edited out.');
      return Promise.resolve(out);
    }
  };
  ctx = IAI.page(cfg);
  ctx.zone('1 · Preview: the inbox, as the person deciding sees it', 'z-inbox', '<div class="row"><label for="viewer" style="margin:0">I am acting as</label><select id="viewer">' + man.humanGate.roles.map(function (r) { return '<option>' + esc(r) + '</option>'; }).join('') + '</select><label for="show" style="margin:0 0 0 8px">Show</label><select id="show"><option value="mine">Waiting for my role</option><option value="pending">All waiting</option><option value="decided">Decided</option><option value="all">Everything</option></select><span class="chip" id="cnt"></span></div><div id="list"></div>');
  ctx.zone('2 · Test bench: put drafts in the inbox', 'z-bench', '<p class="cap">Everything here is <strong>SYNTHETIC</strong>. Drafts normally arrive from widgets by themselves. You can also add one by hand.</p><div id="ingest"></div><label for="paste">Or paste a draft envelope (JSON)</label><textarea id="paste" spellcheck="false"></textarea><div class="row" style="margin-top:8px"><button type="button" id="btnAdd">Add pasted draft</button><button type="button" id="btnSample">Load synthetic sample</button><button type="button" id="btnReset">Reset</button></div><div id="addMsg" role="status" class="cap"></div>');
  ctx.zone('3 · Output: decisions and what was sent on', 'z-out', '<h3>Decision ledger (append-only)</h3><div id="ledger"></div><div class="row"><button type="button" id="btnLedger">Download the ledger (.json)</button></div><h3>Messages sent to other widgets</h3><div id="sent" class="cap"></div>');
  inbox = makeInbox(emit);
  ui.ing = IAI.ingest($('#ingest'), man, function (ing) { ing.usable('OUTPUT EXAMPLE').forEach(function (f) { if (f._added) return; f._added = true; try { var o = JSON.parse(f.text); (Array.isArray(o) ? o : [o]).forEach(function (e) { var r = inbox.add(e); if (!r.ok) $('#addMsg').textContent = f.fileName + ': ' + r.errors.join(' '); }); } catch (e) { $('#addMsg').textContent = f.fileName + ' is not valid JSON, so it was not added.'; } }); render(); renderLedger(); });
  $('#viewer').onchange = $('#show').onchange = render;
  $('#btnAdd').onclick = function () { try { var r = inbox.add(JSON.parse($('#paste').value)); $('#addMsg').textContent = r.ok ? 'Added.' : r.errors.join(' '); $('#addMsg').className = 'cap ' + (r.ok ? 'pass' : 'fail'); } catch (e) { $('#addMsg').textContent = 'Not valid JSON: ' + e.message; $('#addMsg').className = 'cap fail'; } render(); renderLedger(); };
  $('#btnSample').onclick = function () { sampleItems().forEach(function (x) { x.runId = x.runId + '-' + Math.random().toString(36).slice(2, 5); inbox.add(x); }); $('#show').value = 'pending'; render(); };
  $('#btnReset').onclick = function () { inbox = makeInbox(emit); sentLog = []; ui.ing.clear(); render(); renderLedger(); };
  $('#btnLedger').onclick = function () { IAI.download('PF-W03.ledger.json', JSON.stringify({ exportedAt: IAI.nowIso(), ledger: inbox.ledger }, null, 2)); };
  ctx.footer(); render(); renderLedger();
  IAI.listen(cfg, {}, function (p, reply) {
    if (p.kind === 'pending') { var r = inbox.add(p.envelope); render(); renderLedger(); reply({ type: 'iai.ack', runId: p.envelope && p.envelope.runId, accepted: r.ok, pending: !!r.pending, kind: 'pending', errors: r.errors || [] }); return true; }
    if (p.kind === 'decide') {
      if (!p.testMode) { reply({ type: 'iai.ack', runId: p.runId, accepted: false, kind: 'decide', errors: ['Decisions are made by a person in this inbox.'] }); return true; }
      var it = inbox.items.filter(function (x) { return x.env.runId === p.runId; })[0], role = p.role || (it && it.env.gate.role), x = inbox.decide(p.runId, p.decision, role, p.reason, true); render(); renderLedger(); reply({ type: 'iai.ack', runId: p.runId, accepted: !!x.ok, kind: 'decide', released: !!x.released, duplicate: !!x.duplicate, errors: x.errors || [] }); return true;
    }
    return false;
  });
  window.IAI.run = function () { return Promise.resolve({ ok: false, errors: ['This widget takes pending items, not a run.'] }); };
})();
</script></body></html>
