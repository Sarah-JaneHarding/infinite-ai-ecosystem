<!doctype html>
<html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TB-W01 Worksheet Builder · INFINITE-AI</title>
<style>:root{--ink:#05070F;--panel:#0C1224;--panel2:#111A36;--violet:#7C5CFF;--cyan:#2DD4BF;--gold:#F5B841;--rose:#FB7185;--text:#E9EDF8;--muted:#8FA0C2;--line:rgba(143,160,194,.22);--arc:linear-gradient(90deg,#7C5CFF,#2DD4BF);--head:"Space Grotesk",system-ui,sans-serif;--body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--text);font:15px/1.55 var(--body)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 80px}
header.top{position:sticky;top:0;z-index:20;background:rgba(5,7,15,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mark{width:44px;height:22px;flex:none}
.ttl{font:600 1.05rem var(--head);margin:0}
.sp{flex:1}
.chip{display:inline-block;font:600 .66rem var(--body);letter-spacing:.12em;text-transform:uppercase;padding:.2rem .55rem;border-radius:99px;border:1px solid var(--line);color:var(--muted);max-width:100%}
.chip.v{color:#b7a6ff;border-color:rgba(124,92,255,.5)}.chip.c{color:var(--cyan);border-color:rgba(45,212,191,.5)}.chip.g{color:var(--gold);border-color:rgba(245,184,65,.5)}.chip.r{color:var(--rose);border-color:rgba(251,113,133,.5)}
.syn{background:rgba(245,184,65,.12)}
h1{font:700 clamp(1.6rem,4vw,2.3rem) var(--head);margin:1.4rem 0 .2rem;letter-spacing:-.01em}
h1 .arc{background:var(--arc);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--muted);max-width:70ch;margin:.2rem 0 1rem}
.tag{font:italic 500 .85rem var(--head);color:var(--gold)}
section.zone{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0}
section.zone>h2{font:600 .7rem var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:0 0 .8rem}
h3{font:600 1rem var(--head);margin:1rem 0 .4rem}
button,.btn{font:600 .85rem var(--body);color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:.5rem .85rem;cursor:pointer;min-height:38px}
button:hover{border-color:var(--violet)}
button.pri{background:var(--arc);color:#05070F;border:0}
button.ok{border-color:rgba(45,212,191,.6);color:var(--cyan)}button.no{border-color:rgba(251,113,133,.6);color:var(--rose)}button.ed{border-color:rgba(245,184,65,.6);color:var(--gold)}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--text);background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:.5rem .65rem;max-width:100%}
textarea{width:100%;min-height:120px;font:.8rem/1.45 ui-monospace,Menlo,Consolas,monospace}
label{font-size:.82rem;color:var(--muted);display:block;margin:.5rem 0 .2rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.cap{font-size:.8rem;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{text-align:left;padding:.5rem .65rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 .62rem var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
code,pre{font:.78rem ui-monospace,Menlo,Consolas,monospace}
pre{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto;max-height:340px;margin:.4rem 0;white-space:pre-wrap;word-break:break-word}
.pass{color:var(--cyan)}.fail{color:var(--rose)}.warn{color:var(--gold)}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:12px;text-align:center;font-size:.85rem;color:var(--muted);transition:.15s}
.drop.over{border-color:var(--violet);background:rgba(124,92,255,.08)}
.drop b{display:block;margin-bottom:2px}
.dec{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:1px solid rgba(245,184,65,.4);border-radius:12px;background:rgba(245,184,65,.06)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
details{margin:.4rem 0}summary{cursor:pointer;color:var(--muted);font-size:.85rem}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--violet);padding:.5rem .9rem;border-radius:10px;z-index:50;font-size:.85rem}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;font-size:.84rem}.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
@media print{header.top button,.dec,.drop{display:none}body{background:#fff;color:#000}}
 .cardx{display:inline-block;border:2px solid #111;background:#fff;color:#111;width:120px;height:120px;margin:6px;position:relative;font-family:Arial}.cardx b{position:absolute;font-size:22px}.cardx .t{top:2px;left:50%;transform:translateX(-50%)}.cardx .r{right:6px;top:50%;transform:translateY(-50%) rotate(90deg)}.cardx .b{bottom:2px;left:50%;transform:translateX(-50%) rotate(180deg)}.cardx .l{left:6px;top:50%;transform:translateY(-50%) rotate(-90deg)}.cardx i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-style:normal;font-size:30px;color:#888}@media print{.cardx{page-break-inside:avoid}}</style></head><body><div id="app"></div>
